name: Repair splash JPEG once

on:
  push:
    branches: [dev-ui]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'trigger one-time JPEG repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/reencode_splash_logo.py
      - name: Push corrected committed JPEG bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/morphorum-studio-logo.jpg src/morphorum_studio/assets/splash-logo.jpg
          git diff --cached --quiet && exit 0
          git commit -m "fix(assets): re-encode valid splash JPEG without corrupt markers [skip ci]"
          git push origin HEAD:dev-ui
