name: Studio CI

on:
  push:
    branches: [main, 'feature/**', 'dev-*']
  pull_request:

permissions:
  contents: write

jobs:
  shell:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install Studio and developer tooling
        run: python -m pip install -e ".[dev]"
      - name: Compile application code
        run: python -m compileall -q src tests
      - name: Verify CLI entrypoint
        run: python -m morphorum_studio --version
      - name: Run native UI shell tests (offscreen)
        shell: bash
        run: python -X faulthandler -m pytest -v --tb=short -rf 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Summarise test failures
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          t = open("pytest.log", encoding="utf-8", errors="replace").read()
          lines = [l for l in t.splitlines() if l.startswith(("FAILED", "ERROR", "E  "))][:40]
          lines += ["--- last log lines ---"] + t.splitlines()[-25:]
          print("::error title=pytest failures::" + "%0A".join(l.replace("%", "%25")[:300] for l in lines))
          PY
      - name: Verify clean wheel installation and bundled splash
        run: python scripts/verify_clean_install.py
      - name: Render UI screenshots (offscreen)
        continue-on-error: true
        if: matrix.os == 'ubuntu-latest'
        run: |
          python scripts/render_screenshots.py ui-screenshots
          QT_SCALE_FACTOR=1.75 python scripts/render_screenshots.py ui-screenshots/dpi175 --sizes 1200x760,880x560
      - name: Upload UI screenshots
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish screenshots to the ui-screenshots branch
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && startsWith(github.ref_name, 'feature/')
        continue-on-error: true
        run: |
          set -e
          dir=$(mktemp -d)
          cp -r ui-screenshots/. "$dir"/ || exit 0
          rm -f "$dir"/prefs.ini "$dir"/dpi175/prefs.ini
          echo "${GITHUB_SHA}" > "$dir/SOURCE_SHA"
          cd "$dir"
          git init -q
          git checkout -q -b ui-screenshots
          git config user.name "studio-ci"
          git config user.email "studio-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-screenshots
