[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "morphorum-studio"
version = "0.1.0a1"
description = "Native desktop client for local and remote Morphorum GPU backends."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Unlicense"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
morphorum-studio = "morphorum_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
